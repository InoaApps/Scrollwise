<style>

*{box-sizing:border-box;margin:0}html,body{height:100%}

.feed::-webkit-scrollbar{display:none}

.alt{background:var(--bg2)}
.dark{background:var(--ink);color:var(--soft)}
.big{font-size:clamp(34px,10vw,46px);line-height:1.04;margin:14px 0}

.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2.5px var(--ink)}
.dark .btn{background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px}.row .btn{flex:1}
.sp{flex:1}.mt{margin-top:12px}.small{font-size:13px;text-align:center;opacity:.6;margin-top:12px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.prog{display:flex;gap:4px;margin-top:10px}.prog i{flex:1;height:4px;border-radius:4px;background:rgba(0,0,0,.15)}.prog i.on{background:var(--ink)}
.dark .prog i{background:rgba(255,255,255,.2)}.dark .prog i.on{background:var(--bg)}

.verdict{font-size:clamp(64px,20vw,96px);line-height:.95;margin:auto 0 8px}
.pill{display:inline-block;padding:6px 12px;border-radius:99px;font-weight:700;font-size:14px;background:var(--ink);color:var(--bg)}
.hint{text-align:center;font-size:14px;font-weight:700;margin-top:16px;animation:bob 1.4s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
/* explanation */
.why h2{font:800 15px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--bg);margin:22px 0 6px}
.why p{font-size:18px;line-height:1.55}
.take{margin-top:auto;margin-bottom:4px;background:var(--bg);color:var(--ink);border-radius:18px;padding:16px 18px;font-weight:600}
.take b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
/* swipe card */
.deck{position:relative;flex:1;margin:18px 0}
.card{position:absolute;inset:0;background:var(--soft);border-radius:28px;padding:26px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 14px 34px rgba(0,0,0,.18);touch-action:none;user-select:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s}
.card .q{margin:0}
.stamp{position:absolute;top:24px;font:800 24px 'Bricolage Grotesque';padding:2px 12px;border:4px solid;border-radius:10px;opacity:0}
.stamp.y{left:22px;transform:rotate(-12deg);color:#0f9d58}.stamp.n{right:22px;transform:rotate(12deg);color:#e0244d}
/* profile share card */
.pcard{background:var(--ink);color:var(--bg);border-radius:28px;padding:28px;margin:18px 0;text-align:center}
.pcard .e{font-size:72px;line-height:1}
.pcard .d{font-size:36px;margin:8px 0 6px}
.pcard p{color:var(--soft);opacity:.9}
/* domain chooser */
.tile{color:#1a1300;display:block;width:100%;text-align:left;border-radius:24px;padding:22px;margin-top:12px}
.tile .d{font-size:28px}
ul.perks{list-style:none;padding:0;margin:18px 0}ul.perks li{padding:10px 0;border-bottom:2px solid rgba(0,0,0,.1);font-weight:600}
input{width:100%;padding:16px;border-radius:16px;border:2.5px solid var(--ink);background:var(--soft);font:inherit;color:var(--ink);margin-bottom:10px}
/* install prompt */
#inst{position:fixed;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));max-width:496px;margin:0 auto;z-index:20;background:#17130f;color:#fff6e8;border-radius:20px;padding:14px 14px 14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.35);font-size:15px}
#inst img{width:40px;height:40px;border-radius:10px}
#inst b{display:block;font-size:15px}#inst span{opacity:.75;font-size:13px}
#inst .go{background:#ffd84d;color:#1a1300;border-radius:12px;padding:10px 14px;font-weight:700;white-space:nowrap}
#inst .x{background:none;color:#fff6e8;opacity:.6;font-size:22px;padding:0 4px}
#ios{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#ios>div{background:#fff6e8;color:#1a1300;border-radius:24px 24px 0 0;padding:24px 22px max(28px,env(safe-area-inset-bottom));max-width:520px;width:100%}
#ios ol{margin:14px 0 18px;padding-left:22px;font-size:17px;line-height:1.7}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

money:{name:"Money",title:"Make smarter money decisions.",sub:"5 true-or-false cards a day. Each one explains the why, in 3 minutes.",
 profiles:[["🗂️","The Planner","You like to know where every dollar goes. Your blind spot: playing it so safe that your money doesn't grow."],
  ["🛍️","The Enjoyer","Money is for living, and you live well. Your blind spot: small spends that quietly add up."],
  ["🙈","The Avoider","Money stresses you, so you look away. Your edge: a few simple rules will change a lot, fast."]],
 swipes:[["I know roughly how much I spent last month.",0],["I'd rather enjoy money now than save it.",1],["I sometimes avoid opening my banking app.",2],["I have money set aside for emergencies.",0],["A sale often makes me buy things I didn't plan.",1],["Talking about money makes me uncomfortable.",2]],
 cards:[
 {q:"A savings account paying less than inflation loses buying power.",a:true,s:"Your balance grows, but what it can buy shrinks.",
  w:["Inflation measures how fast prices rise. If your account pays 2% a year and prices rise 4%, a year later your money buys about 2% less.","The number on screen went up, but your real wealth went down. That's why economists look at the “real” return: your interest rate minus inflation."],
  t:"Compare your interest rate to inflation, not to zero."},
 {q:"Paying only the minimum on a credit card is a safe way to handle debt.",a:false,s:"It keeps you out of trouble today, but it's the most expensive way to repay.",
  w:["Credit card interest in the US often runs above 20% a year. The minimum payment is set so that much of it covers interest, and only a little reduces what you owe.","A balance of a few thousand dollars can take many years to clear this way, and the total interest can end up larger than what you originally borrowed."],
  t:"Pay more than the minimum, starting with the card that has the highest rate."},
 {q:"A 1% yearly fund fee can eat a big share of your savings over 30 years.",a:true,s:"Around a quarter of your final amount, in a typical case.",
  w:["A fee is taken every year from your whole balance, not just from your gains. And the money taken out also misses all its future growth.","With a 7% yearly return, 30 years with a 1% fee leaves you about 25% less than the same investment with almost no fees."],
  t:"Check a fund's “expense ratio” before you invest."},
 {q:"You need a lot of money to start investing.",a:false,s:"You can start with a few dollars.",
  w:["Many brokers now have no minimum deposit and let you buy fractions of a share. An index fund gives you a slice of hundreds of companies at once.","What matters most over the long run is time: money invested early has more years to compound. Waiting until you have “enough” often costs more than starting small."],
  t:"Start small, automate it, increase it later."},
 {q:"People tend to spend more when paying by card than with cash.",a:true,s:"A card makes paying hurt less, so we spend more.",
  w:["Researchers call it the “pain of paying”. Handing over cash is concrete: you watch it leave. A card tap feels abstract, so the brain registers the loss less.","Several studies have found people willing to pay more, or buy more, when paying by card."],
  t:"For spending you want to control, try a fixed weekly amount."},
 {"q": "Paying off a credit card at 22% interest is like earning a guaranteed 22% return.", "a": true, "s": "Every dollar of that debt you clear stops costing you 22% a year.", "w": ["Interest you no longer pay is money you keep, with zero risk.", "Very few investments reliably return anything close to 22% a year. That's why paying down expensive debt usually comes before investing extra."], "t": "Clear high-interest debt before investing more."},
 {"q": "An emergency fund should cover about 3 to 6 months of expenses.", "a": true, "s": "That's the most common guideline.", "w": ["Financial planners usually suggest 3 to 6 months of essential expenses, so a job loss or a big repair doesn't push you into debt.", "If your income is irregular, aim for the higher end. Keep it in an easy-to-reach savings account, not in stocks."], "t": "Start with one month, then build from there."},
 {"q": "Checking your own credit score lowers it.", "a": false, "s": "Checking your own score has no effect.", "w": ["Looking at your own score is a “soft” inquiry, which doesn't count.", "Only “hard” inquiries, when a lender checks you for a new loan or card, can lower your score a little, and only for a while."], "t": "Check your own credit as often as you like."},
 {"q": "Renting is always throwing money away.", "a": false, "s": "Owning has its own “lost” costs too.", "w": ["Owners pay mortgage interest, property taxes, insurance and maintenance. None of that builds equity either.", "Depending on prices, how long you stay, and what you'd do with the down payment, renting can be the cheaper choice."], "t": "Compare total costs, not rent versus a mortgage payment."},
 {"q": "Over the long run, US stocks have beaten savings accounts.", "a": true, "s": "By a wide margin over decades, with big drops along the way.", "w": ["The S&P 500 has averaged roughly 10% a year before inflation over the long run, far above typical savings rates.", "But it has also fallen 30 to 50% in bad years. That's why stocks are for money you won't need for many years."], "t": "Savings for the short term, stocks for the long term."},
 {"q": "A raise can push all your income into a higher tax bracket.", "a": false, "s": "Only the dollars above the threshold are taxed at the higher rate.", "w": ["US federal income tax is progressive: each rate applies only to the slice of income inside its bracket.", "So a raise never lowers your take-home pay because of brackets. You always keep more than before."], "t": "Never turn down a raise because of tax brackets."},
 {"q": "$3 a day adds up to more than $1,000 a year.", "a": true, "s": "$3 × 365 = $1,095.", "w": ["Small daily habits are easy to ignore because each one feels tiny.", "The point isn't to ban coffee. It's to know which small spends you truly enjoy and which ones you barely notice."], "t": "Keep the treats you love, cut the ones you don't notice."},
 {"q": "“Buy now, pay later” plans never cost anything extra.", "a": false, "s": "Late fees and interest can add up.", "w": ["Many “pay in 4” plans are interest-free if you pay on time, but a missed payment can trigger fees, and longer plans often charge interest.", "Splitting a price into small chunks also makes it feel cheaper, so people tend to spend more."], "t": "Treat it like debt, because it is."},
 {"q": "Starting to invest at 25 instead of 35 can roughly double what you have at 65.", "a": true, "s": "Ten extra years of compounding make a huge difference.", "w": ["Investing the same amount every year at a 7% return, 40 years of saving ends with about twice as much as 30 years.", "The early years matter most, because that money has the longest time to grow."], "t": "Time is the cheapest advantage you have."},
 {"q": "In the US, bank deposits are insured up to a limit if the bank fails.", "a": true, "s": "FDIC insurance covers up to $250,000 per depositor, per bank, per ownership category.", "w": ["If an FDIC-insured bank fails, your deposits up to that limit are protected by the US government.", "Investments such as stocks or crypto are not covered by this insurance, even if you bought them through a bank."], "t": "Check that your bank is FDIC-insured."},
 {"q": "Closing an old credit card always improves your credit score.", "a": false, "s": "It can actually lower it.", "w": ["Closing a card reduces your total available credit, which raises the share you're using. That “utilization” ratio is part of your score.", "It can also eventually shorten your credit history."], "t": "Keep old no-fee cards open and use them lightly."},
 {"q": "Most actively managed funds fail to beat their index over 15 years.", "a": true, "s": "Yes, the large majority fall behind.", "w": ["S&P's SPIVA reports regularly find that around 85 to 90% of US large-company active funds lag the S&P 500 over 15 years.", "A big reason is fees: the index fund costs much less every single year."], "t": "Low-cost index funds are a hard default to beat."},
 {"q": "A $50,000 salary means $50,000 to spend.", "a": false, "s": "Taxes and deductions take a big share first.", "w": ["Federal and state income tax, Social Security and Medicare, plus health insurance or retirement contributions, all come out before you're paid.", "What lands in your account can be a lot lower than your salary."], "t": "Budget with your take-home pay, not your salary."},
 {"q": "An employer 401(k) match is essentially free money.", "a": true, "s": "If you don't contribute enough to get it, you leave part of your pay behind.", "w": ["A common match: your employer adds 50 cents for every dollar you put in, up to 6% of your salary.", "That's an instant 50% return on that money, before any market gains."], "t": "Contribute at least enough to get the full match."},
 {"q": "Losing $100 feels worse than winning $100 feels good.", "a": true, "s": "That's called “loss aversion”.", "w": ["Research by Kahneman and Tversky suggested that losses weigh roughly twice as much as equal gains.", "It explains why people sell winning investments too early and hold on to losing ones too long."], "t": "Judge an investment by its future, not by what you paid."},
 {"q": "Prices ending in .99 make products feel cheaper than they are.", "a": true, "s": "Your brain anchors on the first digit.", "w": ["$4.99 feels closer to $4 than to $5. Researchers call it the “left-digit effect”.", "Pricing studies have found it changes what people buy, even though the difference is one cent."], "t": "Round prices up in your head."},
 {"q": "US inflation has averaged around 3% a year over the last century.", "a": true, "s": "Roughly 3%, which halves money's value in about 24 years.", "w": ["Some years were much higher, like the 1970s or 2022, and some much lower, but the long-run average is close to 3%.", "Using the “rule of 72”: 72 divided by 3 gives about 24 years for prices to double."], "t": "Cash left idle slowly loses value."},
 {"q": "The “rule of 72” estimates how long money takes to double.", "a": true, "s": "Divide 72 by the yearly rate.", "w": ["At 6% a year, money doubles in about 12 years. At 9%, in about 8 years.", "It's an approximation that works best for rates between about 4% and 12%."], "t": "Use it to compare options in seconds."},
 {"q": "Gold has beaten stocks over the long run.", "a": false, "s": "Over long periods, stocks have done better.", "w": ["Gold has had strong stretches, but over multi-decade periods broad stock indexes have produced higher returns.", "Companies generate profits and pay dividends. Gold produces nothing: its value only comes from what others will pay for it."], "t": "Gold can diversify, but it isn't a growth engine."},
 {"q": "Paying your mortgage every two weeks instead of monthly pays it off faster.", "a": true, "s": "You end up making one extra monthly payment a year.", "w": ["26 half-payments a year equal 13 full payments instead of 12.", "On a 30-year loan, this can cut several years and a lot of interest. Watch out for services that charge a fee to set it up."], "t": "Adding 1/12 of a payment each month does the same thing."},
 {"q": "Your income is part of your credit score.", "a": false, "s": "Income isn't in the score at all.", "w": ["FICO scores use payment history, amounts owed, length of credit history, new credit and credit mix.", "Lenders may ask for your income separately, but a high salary doesn't raise your score."], "t": "Paying on time matters more than earning more."},
 {"q": "Shopping hungry can make you buy more, even things that aren't food.", "a": true, "s": "A 2015 study found exactly that.", "w": ["Researchers found that hungry people bought more non-food items, like binder clips, than people who had just eaten.", "Hunger seems to switch on a general “get more” drive, not just a craving for food."], "t": "Eat before you shop, online too."},
 {"q": "Budgeting means tracking every single cent.", "a": false, "s": "Simple systems work well for many people.", "w": ["The 50/30/20 approach splits take-home pay into needs, wants and savings, without logging every coffee.", "Another option is “paying yourself first”: an automatic transfer to savings on payday, then you spend the rest freely."], "t": "Pick the simplest system you'll actually keep."},
 {"q": "Most new US businesses close within their first year.", "a": false, "s": "About 1 in 5 close in year one.", "w": ["US Bureau of Labor Statistics data shows roughly 20% of new businesses close within the first year.", "About half are still open after five years. The risk is real, but it's far from “almost all”."], "t": "Plan for risk, but don't assume failure."},
 {"q": "Cash-back credit cards are always a good deal.", "a": false, "s": "Only if you pay the full balance every month.", "w": ["Typical cash back is 1 to 2%, while card interest is often above 20% a year.", "Carry a balance for a single month and the interest can wipe out months of rewards."], "t": "Rewards are only free if you never pay interest."}]},
food:{name:"Food",title:"Eat smarter, without dieting.",sub:"5 true-or-false cards a day on the food myths everyone believes.",
 profiles:[["🔍","The Label Reader","You check what you eat. Your blind spot: some marketing claims are designed for people exactly like you."],
  ["🍫","The Comfort Eater","Food is how you recharge. Your edge: knowing why cravings hit makes them much easier to handle."],
  ["🍿","The Grazer","You snack more than you sit down for meals. Your edge: small swaps go a long way for you."]],
 swipes:[["I check the nutrition label before buying.",0],["I eat more when I'm stressed or tired.",1],["I often snack instead of eating proper meals.",2],["I know roughly how much protein I eat.",0],["Food is my main way to reward myself.",1],["I often eat in front of a screen.",2]],
 cards:[
 {q:"Brown eggs are healthier than white eggs.",a:false,s:"Shell color depends on the hen's breed, not on nutrition.",
  w:["Hens with white feathers usually lay white eggs, and hens with red or brown feathers usually lay brown ones. Inside, the eggs are basically the same.","Brown eggs often cost more because those breeds tend to be bigger and eat more. What can change nutrition is the hen's diet, for example feed enriched with omega-3."],

 {q:"Fresh vegetables are always more nutritious than frozen ones.",a:false,s:"Frozen vegetables can be just as nutritious.",

  t:"Frozen vegetables are a cheap, healthy shortcut."},
 {q:"Eating fat makes you fat.",a:false,s:"Weight gain comes from total calories, not from fat itself.",
  w:["Fat has more calories per gram (9) than carbs or protein (4), so fatty foods add up fast. But eating fat doesn't turn directly into body fat.","Many “low-fat” products replaced fat with sugar. And fats from nuts, olive oil or fish help you feel full for longer."],

  w:["100 g of cooked chicken breast has about 31 g of protein, and 100 g of cooked lentils about 9 g.","Lentils still win elsewhere: they bring fiber, which chicken doesn't have, and they cost much less. Eating legumes and grains over the day gives a good protein balance."],
  t:"Lentils are a great protein source, just plan bigger portions."},
 {q:"Sugar makes children hyperactive.",a:false,s:"Controlled studies haven't found that effect.",

  t:"Sugar has real downsides, but hyperactivity isn't one that's been shown."},
 {"q": "Carrots give you better night vision.", "a": false, "s": "Only if you're lacking vitamin A.", "w": ["Vitamin A is needed for vision, and a real deficiency causes night blindness. But if you already get enough, extra carrots won't make you see better in the dark.", "The legend was spread in Britain during World War II, partly to hide the use of radar by night fighter pilots."], "t": "Eat carrots for your health, not for superpowers."},
 {"q": "You need exactly 8 glasses of water a day.", "a": false, "s": "There's no scientific basis for that exact number.", "w": ["Needs vary with body size, activity and climate, and water in food, soup, coffee and tea counts too.", "For most healthy people, drinking when thirsty is enough."], "t": "Thirst and pale urine are good guides."},
 {"q": "Moderate coffee drinking counts toward your daily fluids.", "a": true, "s": "Normal amounts count toward your daily fluids.", "w": ["Caffeine is a mild diuretic, but the water in the cup more than makes up for it.", "Studies show that moderate coffee drinkers stay just as hydrated as water drinkers."], "t": "Your morning coffee counts as fluid."},
 {"q": "Eating after 8 p.m. automatically makes you gain weight.", "a": false, "s": "How much you eat matters more than the clock.", "w": ["Some studies link late eating with weight gain, mostly because late-night snacks add extra calories on top of the day.", "Your body doesn't turn food into fat just because it's late."], "t": "Watch what and how much you snack at night."},

 {"q": "Spinach is an exceptional source of iron.", "a": false, "s": "It's decent, but your body absorbs little of it.", "w": ["Spinach has about 2.7 mg of iron per 100 g, similar to many leafy greens, and compounds called oxalates limit how much you absorb.", "Its “super iron” reputation is largely a cartoon-era exaggeration."], "t": "Pair plant iron with vitamin C, like citrus or peppers."},
 {"q": "Breakfast is the most important meal of the day for everyone.", "a": false, "s": "Research doesn't show it matters for everyone.", "w": ["Many studies linking breakfast to good health only observe habits, they don't prove cause and effect.", "Controlled trials find that skipping breakfast doesn't cause weight gain on its own. What you eat over the whole day matters more."], "t": "Eat breakfast if it helps you, skip it if it doesn't."},
 {"q": "Sea salt has much less sodium than table salt.", "a": false, "s": "By weight, they're nearly the same.", "w": ["Both are mostly sodium chloride. Sea salt's bigger crystals mean a teaspoon holds a bit less.", "But gram for gram, the sodium is about the same."], "t": "Cut the amount, not just the type."},
 {"q": "Most sodium in the US diet comes from the salt shaker.", "a": false, "s": "Over 70% comes from packaged and restaurant food.", "w": ["US health agencies estimate that most sodium is already in food before it reaches the table.", "Bread, cured meats, pizza, soups and sandwiches are among the top sources."], "t": "Check labels before blaming your salt shaker."},
 {"q": "Greek yogurt usually has about twice the protein of regular yogurt.", "a": true, "s": "Straining concentrates the protein.", "w": ["Greek yogurt is strained to remove liquid whey, which makes it thicker.", "It typically has around 10 g of protein per 100 g, against roughly 3.5 to 5 g for regular yogurt."], "t": "An easy protein boost at breakfast."},
 {"q": "Honey is much healthier than sugar.", "a": false, "s": "Your body treats it mostly like sugar.", "w": ["Honey has tiny amounts of antioxidants and minerals, but it's about 80% sugar.", "A spoonful even has slightly more calories than a spoonful of table sugar."], "t": "Treat honey as a sweetener, not a health food."},
 {"q": "Cooking tomatoes makes some nutrients easier to absorb.", "a": true, "s": "Lycopene becomes more available when cooked.", "w": ["Heat breaks down the tomato's cell walls, so the antioxidant lycopene in sauce is absorbed better than from raw tomatoes, especially with a little oil.", "Cooking does reduce vitamin C a little."], "t": "Raw and cooked tomatoes are both worth eating."},
 {"q": "Eggs raise blood cholesterol a lot for most people.", "a": false, "s": "For most people, the effect is modest.", "w": ["Saturated and trans fats affect blood cholesterol more than the cholesterol in food. In 2015, US dietary guidelines dropped their daily cholesterol limit.", "Some people do react more strongly than others."], "t": "Eggs can fit a healthy diet; watch what you eat with them."},
 {"q": "Dark chocolate contains caffeine.", "a": true, "s": "A modest amount.", "w": ["Dark chocolate has roughly 20 mg of caffeine per ounce (28 g), depending on cocoa content.", "A cup of coffee has about 95 mg. Milk chocolate has much less."], "t": "A square at night is fine for most people; a whole bar may not be."},
 {"q": "Your body burns more calories digesting protein than fat or carbs.", "a": true, "s": "That's the “thermic effect of food”.", "w": ["Digesting protein uses about 20 to 30% of its calories, against roughly 5 to 10% for carbs and 0 to 3% for fat.", "Protein also keeps you full longer."], "t": "Protein is filling and costs more to process."},
 {"q": "Fruit juice is as healthy as whole fruit.", "a": false, "s": "Juice loses most of the fiber.", "w": ["Without fiber, the sugar reaches your blood faster and you don't feel as full.", "A large glass of orange juice can hold the sugar of three or four oranges, which you'd rarely eat in one go."], "t": "Eat your fruit, don't drink it."},
 {"q": "Organic food is always more nutritious.", "a": false, "s": "Reviews find small or no differences in nutrients.", "w": ["Organic farming limits synthetic pesticides and can have environmental benefits.", "But large reviews of studies find little difference in vitamins and minerals."], "t": "Eating more fruit and vegetables matters more than the label."},
 {"q": "Gluten-free food is healthier for everyone.", "a": false, "s": "Only for people with celiac disease or gluten sensitivity.", "w": ["For most people, gluten causes no harm.", "Gluten-free products are often more processed, lower in fiber and more expensive."], "t": "Avoid gluten for medical reasons, not as a diet."},
 {"q": "Plain popcorn is a whole-grain snack.", "a": true, "s": "Yes, with fiber and few calories.", "w": ["Three cups of air-popped popcorn have about 100 calories and over 3 g of fiber.", "Movie-theater butter, salt and sugar change everything."], "t": "Air-popped is the best version."},
 {"q": "Plain frozen fruit is usually just fruit, with nothing added.", "a": true, "s": "Plain frozen fruit is just fruit.", "w": ["Most frozen fruit is picked, washed and frozen. Only some products “in syrup” add sugar.", "Check that the ingredient list names only the fruit."], "t": "Frozen berries are a cheap, healthy staple."},
 {"q": "Calories on US food labels can be off by up to 20%.", "a": true, "s": "The FDA allows a margin of up to 20%.", "w": ["Nutrient content varies naturally from batch to batch, and lab methods differ.", "Studies find many products close to their label, but some underestimate calories."], "t": "Use labels as a guide, not an exact count."},
 {"q": "Eating many small meals boosts your metabolism.", "a": false, "s": "Meal frequency barely changes calories burned.", "w": ["Digestion burns calories in proportion to how much you eat, not how often.", "Three meals or six, the total ends up similar."], "t": "Choose the rhythm that keeps your hunger in check."}]},
mind:{name:"Mind",title:"Understand your own mind.",sub:"5 true-or-false cards a day on how your brain really works.",
 profiles:[["🌀","The Overthinker","You analyze everything twice. Your edge: depth. Your trap: deciding too late."],
  ["🤝","The People Pleaser","You keep everyone happy. Your trap: your own needs come last."],
  ["⚡","The Doer","You decide fast and fix things on the way. Your trap: skipping the step that would have saved you time."]],
 swipes:[["I replay conversations in my head afterwards.",0],["I find it hard to say no.",1],["I decide fast and adjust later.",2],["I worry about what others think of me.",1],["I need all the information before deciding.",0],["I get bored when plans move slowly.",2]],
 cards:[
 {q:"We only use 10% of our brain.",a:false,s:"You use virtually all of it.",
  w:["Brain imaging shows that even simple tasks activate many areas, and over a day almost every region is active.","The brain is about 2% of body weight but uses around 20% of its energy. Evolution wouldn't keep such an expensive organ 90% idle."],
  t:"There's no hidden 90% to unlock, but you can train the brain you use."},
 {q:"Having more options makes you happier with your choice.",a:false,s:"Too many options often make us less satisfied.",
  w:["In a famous supermarket study, a stand with 24 jams drew more visitors, but a stand with 6 jams led to far more purchases.","Later research shows it depends on the situation, but many options often bring more hesitation and more regret, because we keep imagining the ones we didn't pick."],
  t:"When deciding, narrow it down to 3 good options."},
 {q:"It takes 21 days to form a habit.",a:false,s:"In a key study, it took 66 days on average.",
  w:["The “21 days” idea comes from a 1960s book by a plastic surgeon, about patients getting used to their new face.","A 2009 study at University College London followed people building a new habit. It took 66 days on average, anywhere from 18 to 254 days depending on the person and the habit. Missing one day didn't ruin progress."],
  t:"Expect about two months, and don't quit after a missed day."},
 {q:"Multitasking makes you more productive.",a:false,s:"Your brain mostly switches between tasks, and each switch costs time.",
  w:["For tasks that need attention, the brain doesn't run them in parallel. It jumps from one to the other.","Research on “task switching” shows that each jump has a cost: alternating between tasks is slower and causes more errors than doing them one after the other."],
  t:"Group similar tasks and do one thing at a time."},
 {q:"Forcing a smile can lift your mood a little.",a:true,s:"Yes, slightly: your face can nudge your feelings.",
  w:["This is the “facial feedback” idea. It was debated after some studies failed to replicate it.","In 2022, a large international study with thousands of participants found that posing a smile does produce a small boost in happiness. It won't fix a bad day, but the effect is real."],
  t:"A small effect, but it's free."},
 {"q": "Venting anger, like hitting a pillow, calms you down.", "a": false, "s": "Studies find it often keeps anger going.", "w": ["Research by psychologist Brad Bushman found that hitting a punching bag while thinking about the person who angered you increased anger and aggression.", "Activities that lower your arousal, like slow breathing, work better."], "t": "Slow breathing beats punching."},
 {"q": "People are either “left-brained” or “right-brained”.", "a": false, "s": "Both sides of the brain work together.", "w": ["Some functions lean to one side, like language mostly on the left.", "But a 2013 University of Utah study of over 1,000 brain scans found no sign that people use one side more overall."], "t": "You're not a “type”; skills can be trained."},
 {"q": "Unfinished tasks tend to stick in your mind.", "a": true, "s": "It's often called the Zeigarnik effect.", "w": ["In the 1920s, Bluma Zeigarnik observed that people remembered interrupted tasks better than completed ones. Later studies are mixed on memory.", "But unfinished tasks do keep popping up in our thoughts, and making a plan for them helps quiet them."], "t": "Write tomorrow's to-do list before bed."},
 {"q": "Writing about your worries before an exam can improve your score.", "a": true, "s": "It helped anxious students in a well-known study.", "w": ["A 2011 study published in Science found that students who wrote about their worries for 10 minutes before an exam did better than those who didn't.", "Putting worries on paper seems to free up mental space."], "t": "Empty your worries onto paper before big moments."},
 {"q": "Most drivers think they're better than average.", "a": true, "s": "In a classic study, about 93% of US drivers did.", "w": ["In 1981, Ola Svenson found that most drivers rated themselves above the median, which is mathematically impossible.", "This “better-than-average effect” shows up for many skills."], "t": "Be suspicious of your own self-ratings."},
 {"q": "People are less likely to help in an emergency when others are around.", "a": true, "s": "Responsibility gets diluted.", "w": ["Darley and Latané's experiments in the 1960s showed people helped faster when they were alone.", "Later research shows it isn't universal: real-world footage finds people often do help. But in a crowd, everyone may wait for someone else."], "t": "In an emergency, point at one person and give them a task."},
 {"q": "Being awake for about 18 hours impairs you like alcohol.", "a": true, "s": "Similar to a 0.05% blood alcohol level.", "w": ["A 2000 study found that after 17 to 19 hours without sleep, performance on some tests was as bad as, or worse than, at 0.05% blood alcohol.", "Longer wakefulness made it worse."], "t": "Make big decisions after a night's sleep."},
 {"q": "Teaching to your learning style (visual, auditory…) helps you learn better.", "a": false, "s": "Studies haven't found that matching helps.", "w": ["People do have preferences, but controlled studies show that teaching to a person's preferred “style” doesn't improve results.", "Using several formats helps almost everyone."], "t": "Mix reading, visuals and practice."},
 {"q": "Testing yourself is one of the best ways to learn.", "a": true, "s": "It's called the “testing effect”.", "w": ["In a 2006 study, students who practiced recalling a text remembered much more a week later than students who reread it.", "Struggling to remember strengthens memory more than reading again."], "t": "Close the book and quiz yourself."},
 {"q": "Positive thinking alone makes you more likely to reach your goals.", "a": false, "s": "Only dreaming about success can lower effort.", "w": ["Psychologist Gabriele Oettingen found that people who only fantasize about success often achieve less, maybe because the brain feels it's already done.", "Pairing the dream with obstacles and a plan works better. She calls it WOOP: wish, outcome, obstacle, plan."], "t": "Picture the goal, then the obstacle, then your plan."},
 {"q": "Willpower is a tank that runs out during the day.", "a": false, "s": "Large replication studies failed to confirm it.", "w": ["The idea of “ego depletion” was very popular, but a 2016 project across many labs with over 2,000 participants found little or no effect.", "Some research suggests your beliefs about willpower matter more than any tank."], "t": "Build routines instead of relying on willpower."},
 {"q": "Likes on social media activate the brain's reward system.", "a": true, "s": "Brain scans show it.", "w": ["A 2016 UCLA study scanned teenagers looking at photos. Photos with more likes activated reward regions such as the nucleus accumbens.", "Unpredictable rewards are what keep us checking again and again."], "t": "Turn off like notifications."},
 {"q": "Memories work like video recordings.", "a": false, "s": "Memories are rebuilt each time you recall them.", "w": ["Psychologist Elizabeth Loftus showed that simply changing the wording of a question can change what people “remember” seeing.", "False memories can even be created. Confidence in a memory doesn't prove it's accurate."], "t": "Write down important things soon after they happen."},
 {"q": "Opposites attract in long-term couples.", "a": false, "s": "People tend to pair with similar partners.", "w": ["Research finds couples are usually similar in values, education and attitudes.", "A large 2023 analysis found partners were more alike than different on most traits studied."], "t": "Shared values matter more than contrast."},
 {"q": "Spending on experiences tends to bring more lasting happiness than buying things.", "a": true, "s": "Experiences tend to win.", "w": ["Studies by Van Boven and Gilovich found that experiences bring more lasting satisfaction than objects.", "We retell experiences, they become part of who we are, and we compare them less with what others have."], "t": "Spend on memories when you can."},
 {"q": "Putting a feeling into words can make it less intense.", "a": true, "s": "Psychologists call it “affect labeling”.", "w": ["A 2007 UCLA study found that naming an emotion reduced activity in the amygdala, the brain's alarm center.", "Simply saying “I feel anxious” can take some of the edge off."], "t": "Name the feeling instead of fighting it."},
 {"q": "We're more likely to believe something we've heard several times.", "a": true, "s": "It's called the illusory truth effect.", "w": ["Repetition makes a statement feel familiar, and familiarity feels like truth.", "It works even for false claims, and even when people know the right answer."], "t": "Ask “is it true?”, not “have I heard this?”."},
 {"q": "A short walk can boost creative thinking.", "a": true, "s": "A Stanford study found a big jump.", "w": ["In 2014, researchers found that people came up with about 60% more creative ideas while walking than while sitting.", "The boost lasted for a short while after the walk too."], "t": "Stuck on a problem? Go for a walk."},
 {"q": "In a study, many people chose a mild electric shock over sitting alone with their thoughts.", "a": true, "s": "For just 15 minutes.", "w": ["In a 2014 study published in Science, 67% of men and 25% of women gave themselves at least one shock rather than sit quietly with nothing to do.", "Many found being alone with their thoughts surprisingly unpleasant."], "t": "Boredom is a skill worth practicing."},
 {"q": "Introverts are shy.", "a": false, "s": "Introversion is about energy, not fear.", "w": ["Introverts recharge in calmer settings. Shyness is a fear of being judged by others.", "An introvert can be socially confident, and an extrovert can be shy."], "t": "Don't confuse quiet with anxious."},
 {"q": "Your gut feeling is reliable in any situation.", "a": false, "s": "Intuition works only with practice and clear feedback.", "w": ["Psychologists Daniel Kahneman and Gary Klein agreed that intuition is reliable in predictable fields where people get fast, clear feedback, like firefighting or chess.", "In random fields like stock picking, gut feelings are often wrong."], "t": "Trust your gut only where you've trained it."},
 {"q": "Writing down what you're grateful for can improve well-being.", "a": true, "s": "Small but consistent effects.", "w": ["In a 2003 study, people who wrote down things they were grateful for each week reported feeling better about their lives than people who listed hassles.", "The effects are modest, but it costs nothing."], "t": "Write down 3 good things before bed."},
 {"q": "A random number can change your estimate of something unrelated.", "a": true, "s": "It's called the anchoring effect.", "w": ["In a famous 1974 experiment, people who saw a wheel stop at 65 guessed a higher share of African countries in the UN than those who saw it stop at 10.", "The first number we see pulls our estimate toward it, even when it's meaningless."], "t": "Make your own estimate before seeing anyone else's number."},
 {"q": "It takes 10,000 hours to master any skill.", "a": false, "s": "The number is an oversimplification.", "w": ["It came from popular books about Anders Ericsson's research on violinists. Ericsson himself said it isn't a magic number.", "Some skills need far less time, others more. What matters most is focused, deliberate practice."], "t": "Focus on how you practice, not just how long."},
 {"q": "People feel happier spending money on others than on themselves.", "a": true, "s": "Even with small amounts.", "w": ["In a 2008 study, people given $5 or $20 were happier at the end of the day if they had been told to spend it on someone else.", "Giving seems to lift the giver too."], "t": "A small gift can lift your mood as well."}]}};

/* ================= STATE ================= */
const P=new URLSearchParams(location.search);let dom=P.get("d");if(!D[dom])dom=null;
let S={};try{S=JSON.parse(localStorage.getItem("ds2")||"{}")}catch{}
const save=()=>{try{localStorage.setItem("ds2",JSON.stringify(S))}catch{}};
const $=document.getElementById("app");const el=s=>$.querySelector(s);
const vib=()=>{try{navigator.vibrate&&navigator.vibrate(15)}catch{}};
const day=(o=0)=>new Date(Date.now()-o*864e5).toISOString().slice(0,10);
const share=async t=>{try{if(navigator.share)await navigator.share({text:t,url:location.href});else{await navigator.clipboard.writeText(t+" "+location.href);alert("Link copied")}}catch{}};
const go=d=>{location.search="?d="+d};

/* ================= SCREENS ================= */
function chooser(){document.body.className="home";
 $.innerHTML=`<div class="scr"><span class="tag">${NAME}</span><h1 class="big">Pick one topic.<br>Get sharper at it every day.</h1>
 ${Object.keys(D).map(k=>`<button class="tile" data-k="${k}" style="background:${k=="money"?"#ffd84d":k=="food"?"#a6ec8c":"#cdb8ff"}"><span class="tag">${D[k].name}</span><div class="d">${D[k].title}</div></button>`).join("")}</div>`;
 $.querySelectorAll(".tile").forEach(b=>b.onclick=()=>go(b.dataset.k))}

function intro(){const d=D[dom];const st=S[dom]||{};
 if(st.profile!==undefined)return daily();
 $.innerHTML=`<div class="scr"><span class="tag">${NAME} · ${d.name}</span><div class="sp"></div><h1 class="big">${d.title}</h1><p class="lead">${d.sub}</p><div class="sp"></div>
 <button class="btn" id="go">Find my ${d.name.toLowerCase()} profile</button><div class="small">6 quick swipes · free</div></div>`;
 el("#go").onclick=()=>swipe(0,[0,0,0])}

function hideInst(){const b=document.getElementById("inst");if(b)b.remove()}
function swipe(i,t){hideInst();const d=D[dom];if(i>=d.swipes.length)return result(t);
 $.innerHTML=`<div class="scr"><div class="top"><span>Your ${d.name.toLowerCase()} profile</span><span>${i+1}/${d.swipes.length}</span></div>
 <div class="prog">${d.swipes.map((_,k)=>`<i class="${k<i?"on":""}"></i>`).join("")}</div>
 <div class="deck"><div class="card" id="c"><span class="stamp y">ME</span><span class="stamp n">NOT ME</span><div class="d q">${d.swipes[i][0]}</div></div></div>
 <div class="row"><button class="btn ghost" id="n">Not me</button><button class="btn" id="y">That's me</button></div></div>`;
 const c=el("#c"),st=c.querySelectorAll(".stamp");
 const done=y=>{vib();if(y)t[d.swipes[i][1]]++;c.style.transform=`translateX(${y?130:-130}%) rotate(${y?14:-14}deg)`;c.style.opacity=0;setTimeout(()=>swipe(i+1,t),260)};
 el("#y").onclick=()=>done(1);el("#n").onclick=()=>done(0);
 let x0=null,dx=0;c.onpointerdown=e=>{x0=e.clientX;dx=0;c.setPointerCapture(e.pointerId);c.style.transition="none"};
 c.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;st[0].style.opacity=Math.max(0,dx/90);st[1].style.opacity=Math.max(0,-dx/90)};
 c.onpointerup=()=>{if(x0===null)return;x0=null;c.style.transition="";if(Math.abs(dx)>80)done(dx>0);else{c.style.transform="";st.forEach(s=>s.style.opacity=0)}}}

function result(t){const d=D[dom];const k=t.indexOf(Math.max(...t));const p=d.profiles[k];S[dom]=Object.assign(S[dom]||{},{profile:k});save();
 $.innerHTML=`<div class="scr"><span class="tag">Your ${d.name.toLowerCase()} profile</span>
 <div class="pcard"><div class="e">${p[0]}</div><div class="d">${p[1]}</div><p>${p[2]}</p><div class="small" style="opacity:.7">${NAME}</div></div>
 <div class="sp"></div><button class="btn" id="nx">Start today's 3-minute session</button><button class="btn ghost mt" id="sh">Share my profile</button></div>`;
 el("#nx").onclick=daily;el("#sh").onclick=()=>share(`I'm ${p[1]} ${p[0]} on ${NAME}. What's your ${d.name.toLowerCase()} profile?`)}

function paywall(){const d=D[dom];
 $.innerHTML=`<div class="scr"><span class="tag">${NAME} Premium</span><h1 class="big">One plan.<br>Every topic.</h1>
 <ul class="perks"><li>📚 5 new cards a day, each with a full explanation</li><li>🔥 Streak, score and a new profile every Sunday</li><li>🧭 Money, Food and Mind, all included</li></ul>
 <p style="font-weight:600">7 days free, then $39.99/year.</p><p style="font-size:14px;margin:6px 0 14px;opacity:.75">Early test: nobody is charged today. Leave your email to get early access and a launch discount.</p>
 <input id="em" type="email" placeholder="you@email.com" autocomplete="email" aria-label="Email">
 <button class="btn" id="tr">Start my free week</button><button class="btn ghost mt" id="sk">Just try today's cards</button></div>`;
 el("#tr").onclick=()=>{const e=el("#em").value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){el("#em").focus();return}S.email=e;save();send("waitlist",{email:e});daily()};
 el("#sk").onclick=()=>{S[dom].skip=1;save();daily()}}

function mix(c){const t=c.filter(x=>x.a),f=c.filter(x=>!x.a),r=[];let a=0,b=0;while(r.length<c.length){if(a<t.length&&(b>=f.length||a/t.length<=b/f.length))r.push(t[a++]);else r.push(f[b++])}return r}
function daily(){const st0=S[dom]||(S[dom]={});if(!st0.start){st0.start=day();save()}
 const all=mix(D[dom].cards),sets=Math.floor(all.length/5),k=Math.round((Date.parse(day())-Date.parse(st0.start))/864e5)%sets;
 const d={...D[dom],cards:all.slice(k*5,k*5+5)};let i=0,score=0;hideInst();
 $.innerHTML=`<div class="feed" id="f"></div>`;const f=el("#f");
 const prog=n=>`<div class="prog">${d.cards.map((_,k)=>`<i class="${k<n?"on":""}"></i>`).join("")}</div>`;
 function ask(quiet){const c=d.cards[i];const s=document.createElement("section");s.className="scr"+(i%2?" alt":"");
  s.innerHTML=`<div class="top"><span>${d.name} · today</span><span>${i+1}/${d.cards.length}</span></div>${prog(i)}<div class="tag" style="margin-top:22px">True or false?</div><div class="d q">${c.q}</div><div class="row"><button class="btn" data-a="1">True</button><button class="btn ghost" data-a="0">False</button></div>`;
  f.appendChild(s);if(!quiet)s.scrollIntoView({behavior:"smooth"});
  s.querySelector(".row").onclick=e=>{const a=e.target.dataset.a;if(a===undefined)return;const ok=(a==="1")===c.a;if(ok)score++;vib();
   // step 1: verdict
   s.querySelector(".row").outerHTML=`<div><div class="d verdict">${ok?"Yes!":"Nope."}</div><span class="pill">It's ${c.a?"TRUE":"FALSE"}</span><p class="lead mt">${c.s}</p><div class="hint">Why? Scroll ↑</div></div>`;
   s.querySelector(".q").style.margin="18px 0 0";
   // step 2: detailed explanation
   const w=document.createElement("section");w.className="scr dark why";
   w.innerHTML=`<div class="top"><span>Why it's ${c.a?"true":"false"}</span><span>${i+1}/${d.cards.length}</span></div>${prog(i+1)}<h2>The explanation</h2>${c.w.map(p=>`<p class="mt">${p}</p>`).join("")}<div class="take mt"><b>Remember</b>${c.t}</div><div class="hint">${i+1<d.cards.length?"Next card":"Your score"} ↑</div>`;
   f.appendChild(w);i++;i<d.cards.length?ask(1):end()}}
 function end(){const st=S[dom];if(st.last!==day()){st.streak=st.last===day(1)?(st.streak||0)+1:1;st.last=day();save();send("plays",{score,details:{d:dom,profile:st.profile,streak:st.streak}})}
  const others=Object.keys(D).filter(k=>k!==dom);const s=document.createElement("section");s.className="scr";
  s.innerHTML=`<span class="tag">Today's score · ${d.name}</span><div class="sp"></div><div class="d" style="font-size:110px;line-height:1">${score}/${d.cards.length}</div><p class="d" style="font-size:26px">🔥 ${st.streak}-day streak</p><p class="lead mt">5 new cards tomorrow.</p><div class="sp"></div>
  <div id="keep"><p class="d" style="font-size:22px;margin-bottom:8px">Keep your streak alive</p><p style="font-size:15px;margin-bottom:10px">Get tomorrow's cards by email. Free, unsubscribe anytime.</p>
  <input id="em" type="email" placeholder="you@email.com" autocomplete="email" aria-label="Email"><button class="btn" id="kp">Send me tomorrow's cards</button></div>
  <button class="btn ghost mt" id="sh">Share my score</button><p class="small" style="margin:14px 0 8px">Try another topic</p><div class="row">${others.map(k=>`<button class="btn ghost" data-k="${k}">${D[k].name}</button>`).join("")}</div>`;
  f.appendChild(s);s.scrollIntoView({behavior:"smooth"});setTimeout(installBar,1200);
  s.querySelector("#sh").onclick=()=>share(`${score}/${d.cards.length} on today's ${d.name} cards, ${st.streak}-day streak 🔥 ${NAME}`);
  s.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>go(b.dataset.k));
  const keep=s.querySelector("#keep");if(S.email)founder(keep);
  s.querySelector("#kp").onclick=()=>{const e=s.querySelector("#em").value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){s.querySelector("#em").focus();return}S.email=e;save();send("waitlist",{email:e,score});founder(keep)}}
 function founder(k){k.innerHTML=`<p class="d" style="font-size:22px">You're in ✓</p><p style="font-size:15px;margin:4px 0 10px">Want all 3 topics, unlimited cards and your weekly profile? Founding members get 50% off for life when Premium launches.</p><button class="btn" id="fd">Reserve my founder spot</button><p class="small" style="margin-top:6px">No payment now.</p>`;
  k.querySelector("#fd").onclick=()=>{if(!S.fd){S.fd=1;save();send("plays",{score:0,details:{event:"founder_click",d:dom}})}k.innerHTML=`<p class="d" style="font-size:22px">Spot reserved 🎉</p><p style="font-size:15px">We'll email you before launch.</p>`}}
 ask()}

/* ================= INSTALL (PWA) ================= */
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
let deferred=null;
const inApp=/Instagram|FBAN|FBAV|TikTok|musical_ly|Snapchat|Twitter/i.test(navigator.userAgent);
function installBar(){
 if(standalone()||document.getElementById("inst")||document.querySelector(".deck"))return;
 try{if(+localStorage.getItem("sw_inst_x")>Date.now())return}catch{}
 if(!deferred&&!isIOS)return; // browser can't install: show nothing
 const b=document.createElement("div");b.id="inst";
 b.innerHTML=`<img src="icons/icon-192.png" alt=""><div style="flex:1"><b>Get the Scrollwise app</b><span>Free · on your home screen</span></div><button class="go">Install</button><button class="x" aria-label="Not now">×</button>`;
 document.body.appendChild(b);
 b.querySelector(".x").onclick=()=>{b.remove();try{localStorage.setItem("sw_inst_x",Date.now()+3*864e5)}catch{}};
 b.querySelector(".go").onclick=async()=>{
  if(deferred){deferred.prompt();const r=await deferred.userChoice;deferred=null;b.remove();if(r.outcome==="accepted")send("plays",{score:0,details:{event:"install",d:dom}});return}
  const m=document.createElement("div");m.id="ios";
  m.innerHTML=`<div><h2 class="d" style="font-size:26px">Add Scrollwise to your home screen</h2>${inApp?`<p style="margin-top:10px;font-weight:600">First, open this page in Safari: tap the <b>•••</b> menu, then <b>Open in browser</b>.</p>`:""}<ol><li>Tap the <b>Share</b> button <span aria-hidden="true">⬆️</span> at the bottom of Safari</li><li>Scroll down and tap <b>Add to Home Screen</b></li><li>Tap <b>Add</b></li></ol><button class="btn" style="background:#1a1300;color:#ffd84d">Got it</button></div>`;
  document.body.appendChild(m);m.onclick=e=>{if(e.target===m||e.target.tagName==="BUTTON")m.remove()}}}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;installBar()});
addEventListener("appinstalled",()=>{const b=document.getElementById("inst");if(b)b.remove()});
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
if(standalone()&&S.io!==day()){S.io=day();save();send("plays",{score:0,details:{event:"open_installed",d:dom}})}

if(!dom)chooser();else{document.body.className=dom;intro()}
setTimeout(()=>{if(!document.querySelector(".feed,.deck"))installBar()},1500);
</script></body></html>
